[package]
name = "fido-labs"
version = "3.0.0"
edition = "2021"
description = "FIDO-LABS v3 - Forensic Integrated Data Operator - Extraction & Analyse Forensique"
authors = ["FIDO-LABS Team"]
license = "Proprietary"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rusb = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
uuid = { version = "1.8", features = ["v4"] }
walkdir = "2"
encoding_rs = "0.8"
byteorder = "1.5"
once_cell = "1.19"
printpdf = "0.7"
plist = "1.7"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Build debug allégé en mémoire (machine 7.5 Go) : pas d'infos de débogage lourdes
[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
